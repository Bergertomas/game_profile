name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source and build verification
        run: npm run verify

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/game_profile_ci
      CONFIRM_DATABASE_RESET: game_profile_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Run database contract regression
        run: npm run test:db

      # A database of its own, not the one the contract regression leaves
      # behind: that suite deliberately ends holding extra scopes, extra
      # rubrics and published fixtures, none of which the parity corpus is.
      - name: Set up the read-path database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS game_profile_read_ci' \
            -c 'CREATE DATABASE game_profile_read_ci'
          npm run db:setup
        env:
          PGPASSWORD: postgres
          ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/game_profile_read_ci

      # The Postgres read path: fixture/database parity for the calibration
      # corpus, and the public selection rules. Needs a real database, so it
      # cannot live in the unit suite.
      - name: Run the database-backed read-path suite
        run: npm run test:db-read
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/game_profile_read_ci

      - name: Run browser integration tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/game_profile_read_ci

      - name: Verify the production Worker runtime
        run: npm run cf:verify
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/game_profile_read_ci

      - name: Check the deployable Worker artifact
        run: npm run check:containment
