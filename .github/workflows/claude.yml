name: Claude Code Runner

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.comment.body, '/claude-extra') ||
      contains(github.event.comment.body, '/claude-max')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          branch_prefix: claude/
          track_progress: true
          additional_permissions: |
            actions: read
          trigger_phrase: ${{ contains(github.event.comment.body, '/claude-max') && '/claude-max' || contains(github.event.comment.body, '/claude-extra') && '/claude-extra' || '@claude' }}
          claude_args: >-
            --model opus
            --effort ${{ contains(github.event.comment.body, '/claude-max') && 'max' || contains(github.event.comment.body, '/claude-extra') && 'xhigh' || 'high' }}
            --max-turns ${{ contains(github.event.comment.body, '/claude-max') && '60' || contains(github.event.comment.body, '/claude-extra') && '45' || '30' }}
            --allowedTools Bash,Edit,Read,Write,Glob,Grep
