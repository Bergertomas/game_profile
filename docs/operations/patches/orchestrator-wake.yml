name: Orchestrator Wake Bridge

on:
  workflow_run:
    workflows:
      - Claude Code Runner
      - CI
    types: [completed]

# This workflow is deliberately mechanical. It may emit one metadata-only PR
# comment; it may not judge work, merge, launch Claude, or mutate project state.
#
# `pull-requests: write` is the entire permission set, and it is load-bearing.
# The bridge only ever comments on a pull-request conversation. That call goes
# through the Issues API, but GitHub gates it on the `pull_requests` permission
# when the target is a PR, so `issues: write` does not grant it. Proven live:
# bridge run 33886463641 held `Issues: write` / `PullRequests: read`, and
# `POST /repos/Bergertomas/game_profile/issues/93/comments` answered
# `403 Resource not accessible by integration` with
# `x-accepted-github-permissions: issues=write; pull_requests=write`.
#
# `issues: write` is therefore dropped: it only covers a genuine issue target,
# which this bridge never has — every target is resolved through the Pulls API.
# `actions: read` and `contents: read` are dropped too; the script makes no
# Actions API call and the job performs no checkout.
permissions:
  pull-requests: write

concurrency:
  group: orchestrator-wake-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  emit-wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve one PR and emit one idempotent wake comment
        uses: actions/github-script@v7
        with:
          script: |
            const EXPECTED_OWNER = 'Bergertomas';
            const EXPECTED_REPO = 'game_profile';
            const EXPECTED_REPOSITORY = `${EXPECTED_OWNER}/${EXPECTED_REPO}`;
            const WAKE_SCHEMA = 'should-i-play.orchestrator-wake.v1';
            const WAKE_MARKER = 'should-i-play-orchestrator-wake:v1';

            // Discriminate on the workflow DEFINITION, never on the run name.
            // When a workflow sets `run-name` — claude.yml does, to stay
            // machine-addressable — GitHub replaces both `workflow_run.name`
            // and `workflow_run.display_title` with the evaluated run name. A
            // `run.name === 'Claude Code Runner'` test therefore never matches
            // the very runs this bridge exists to observe, and every Claude
            // completion falls through to a green, silent no-op. The definition
            // path survives `run-name` and is what we compare.
            const CLAUDE_WORKFLOW = { path: '.github/workflows/claude.yml', name: 'Claude Code Runner' };
            const CI_WORKFLOW = { path: '.github/workflows/ci.yml', name: 'CI' };

            if (context.repo.owner !== EXPECTED_OWNER || context.repo.repo !== EXPECTED_REPO) {
              core.setFailed(`Repository identity mismatch: ${context.repo.owner}/${context.repo.repo}`);
              return;
            }

            const run = context.payload.workflow_run;
            if (!run || run.status !== 'completed') {
              core.setFailed('Expected one completed workflow_run payload.');
              return;
            }

            // A workflow defined in this repository reports a repo-relative
            // path; only a reusable workflow called from elsewhere carries the
            // `owner/repo/.github/workflows/x.yml@ref` shape. Normalise so the
            // comparison cannot be defeated by either form.
            const normalizeWorkflowPath = (value) => {
              if (typeof value !== 'string') return null;
              const withoutRef = value.split('@')[0];
              const index = withoutRef.indexOf('.github/workflows/');
              return index === -1 ? withoutRef : withoutRef.slice(index);
            };

            const workflowPath =
              normalizeWorkflowPath(run.path) ?? normalizeWorkflowPath(context.payload.workflow?.path);

            const definition =
              workflowPath === CLAUDE_WORKFLOW.path ? CLAUDE_WORKFLOW :
              workflowPath === CI_WORKFLOW.path ? CI_WORKFLOW :
              null;

            if (!definition) {
              core.notice(`Workflow definition ${workflowPath ?? '(unknown)'} is not in the bounded wake set; no-op.`);
              return;
            }

            // Unrelated comments still instantiate the Claude workflow, whose
            // job is then skipped by its trigger-phrase guard. They are not
            // Claude completions and must not wake the orchestrator.
            if (definition === CLAUDE_WORKFLOW && run.conclusion === 'skipped') {
              core.notice(`Ignoring skipped Claude workflow run ${run.id}.`);
              return;
            }

            let prNumber = null;
            let association = null;
            let sourceWorkItemNumber = null;
            let sourceCommentId = null;

            if (definition === CI_WORKFLOW) {
              const pullRequests = Array.isArray(run.pull_requests) ? run.pull_requests : [];
              if (pullRequests.length !== 1) {
                core.notice(`CI run ${run.id} has ${pullRequests.length} associated PRs; fail closed.`);
                return;
              }
              prNumber = pullRequests[0].number;
              association = 'workflow_run.pull_requests';
            } else {
              // `display_title` is the field that carries the evaluated run
              // name, and it is the only thing here we parse for identity.
              const runName = typeof run.display_title === 'string' ? run.display_title : '';
              const match = /^claude-work-item-(\d+)-comment-(\d+)$/.exec(runName);
              if (!match) {
                core.notice(`Claude run ${run.id} lacks the machine-addressable run-name; fail closed.`);
                return;
              }

              sourceWorkItemNumber = Number(match[1]);
              sourceCommentId = Number(match[2]);

              // A PR comment/review-comment invocation already gives us the
              // durable event surface directly.
              try {
                const { data: sourcePr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: sourceWorkItemNumber,
                });
                // The real boundary is the HEAD repository. `pulls.get` is
                // already scoped to owner/repo, so a returned PR's base repo
                // can only ever be this repository — testing it proves
                // nothing and would happily accept a fork head. This bridge
                // addresses in-repository task branches, so require that.
                if (sourcePr.head?.repo?.full_name !== EXPECTED_REPOSITORY) {
                  core.notice(`Claude source PR #${sourceWorkItemNumber} has an out-of-repository head; fail closed.`);
                  return;
                }
                prNumber = sourceWorkItemNumber;
                association = 'claude_source_pr';
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              // Legacy issue-first invocations can still succeed by creating a
              // Claude task PR. Resolve only an unambiguous open PR whose branch
              // carries the runner's canonical issue-number prefix. If Claude
              // failed before a PR existed, there is intentionally no fallback
              // target: the hourly watchdog remains recovery until PR-first is
              // adopted through the documented owner/orchestrator process.
              //
              // Known and deliberately contained: if a run fails before opening
              // its PR while one older `claude/issue-<n>-*` PR is still open,
              // that stale PR is the single candidate and becomes the target.
              // The wake stays metadata-only, `target_pr_head` reports the head
              // actually named, and the orchestrator reconstructs the event from
              // live GitHub, so a stale association is visible rather than acted
              // on. It is not a fail-closed case.
              if (prNumber === null) {
                const prefix = `claude/issue-${sourceWorkItemNumber}-`;
                const pulls = await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  base: 'main',
                  per_page: 100,
                });
                const candidates = pulls.filter((pull) =>
                  pull.head?.repo?.full_name === EXPECTED_REPOSITORY &&
                  typeof pull.head?.ref === 'string' &&
                  pull.head.ref.startsWith(prefix)
                );

                if (candidates.length !== 1) {
                  core.notice(`Claude issue run ${run.id} resolved ${candidates.length} open task PRs; fail closed.`);
                  return;
                }
                prNumber = candidates[0].number;
                association = 'claude_issue_branch_prefix';
              }
            }

            const { data: targetPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (targetPr.head?.repo?.full_name !== EXPECTED_REPOSITORY) {
              core.setFailed(`Resolved PR #${prNumber} does not have an in-repository head.`);
              return;
            }

            const eventId = `workflow_run:${run.id}:attempt:${run.run_attempt}`;
            const marker = `<!-- ${WAKE_MARKER} event_id=${eventId} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            if (comments.some((comment) => typeof comment.body === 'string' && comment.body.includes(marker))) {
              core.notice(`Wake ${eventId} already exists on PR #${prNumber}; no-op.`);
              return;
            }

            const payload = {
              schema: WAKE_SCHEMA,
              event_id: eventId,
              event_type: 'workflow_run.completed',
              repository: EXPECTED_REPOSITORY,
              target_pr: prNumber,
              association,
              workflow: {
                // The definition name, resolved from the definition path, so a
                // custom `run-name` cannot make this field lie. The evaluated
                // run name is reported separately.
                name: definition.name,
                path: definition.path,
                run_name: typeof run.display_title === 'string' ? run.display_title : null,
                run_id: run.id,
                run_attempt: run.run_attempt,
                conclusion: run.conclusion,
              },
              // Where the RUNNER executed from. `issue_comment` and
              // `pull_request_review_comment` workflows always execute from the
              // default branch, so a Claude wake reports `main` here by design.
              // This is not the task PR head; `target_pr_head` is.
              runner_source: {
                work_item_number: sourceWorkItemNumber,
                comment_id: sourceCommentId,
                head_branch: run.head_branch,
                head_sha: run.head_sha,
              },
              // The head of the PR this event was associated with, read live
              // from the Pulls API at wake time.
              target_pr_head: {
                ref: targetPr.head?.ref ?? null,
                sha: targetPr.head?.sha ?? null,
              },
            };

            const body = `${marker}\n\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\``;
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            } catch (error) {
              if (error.status === 403) {
                const accepted = error.response?.headers?.['x-accepted-github-permissions'] ?? 'not reported';
                core.setFailed(
                  'Cannot comment on PR #' + prNumber + ': ' + error.message +
                  '. A pull-request conversation comment needs the workflow permission "pull-requests: write"' +
                  ' (GitHub accepted: ' + accepted + ').'
                );
                return;
              }
              throw error;
            }

            core.notice(`Emitted ${eventId} on PR #${prNumber}; no project judgment was performed.`);
